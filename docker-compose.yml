services:
  db:
    image: postgres:16-alpine
    container_name: frameverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: frameverse_db
      POSTGRES_USER: frameverse
      POSTGRES_PASSWORD: frameverse_local
    ports:
      - "5434:5432"
    volumes:
      - frameverse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frameverse -d frameverse_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  frameverse_pg_data:
